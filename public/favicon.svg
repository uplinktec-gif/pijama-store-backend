<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background com gradiente rosa -->
  <defs>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e75480;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d43a70;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="100" height="100" fill="url(#pinkGradient)"/>

  <!-- "P" grande e branco -->
  <text x="50" y="75" font-size="70" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">P</text>

  <!-- Pequeno detalhe - uma fita/pijama -->
  <circle cx="75" cy="25" r="8" fill="white" opacity="0.7"/>
</svg>
