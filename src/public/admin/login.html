<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Pijama Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 90%;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
      font-size: 48px;
    }
    h1 {
      text-align: center;
      color: #1a1a2e;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #e75480;
      box-shadow: 0 0 0 3px rgba(231, 84, 128, 0.1);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #e75480;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #d63d6d;
    }
    .error {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 5px;
      display: none;
    }
    .loading {
      display: none;
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 10px;
    }
    .spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #e75480;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      margin: 0 auto 5px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">🔐</div>
    <h1>Admin Panel</h1>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email ou Usuário</label>
        <input type="text" id="email" name="email" required placeholder="admin@pijama.store">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>

      <div id="error" class="error"></div>
      <div class="loading">
        <div class="spinner"></div>
        <span>Autenticando...</span>
      </div>

      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error');
      const loadingDiv = document.querySelector('.loading');
      const btn = document.querySelector('button');

      errorDiv.style.display = 'none';
      loadingDiv.style.display = 'block';
      btn.disabled = true;

      try {
        const response = await fetch('/admin/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.mensagem || 'Falha na autenticação');
        }

        // Store token
        localStorage.setItem('adminToken', data.token);

        // Redirect to dashboard
        window.location.href = '/admin/';
      } catch (error) {
        errorDiv.textContent = '❌ ' + (error.message || 'Erro ao fazer login');
        errorDiv.style.display = 'block';
        loadingDiv.style.display = 'none';
        btn.disabled = false;
      }
    });

    // Check if already logged in
    if (localStorage.getItem('adminToken')) {
      window.location.href = '/admin/';
    }
  </script>
</body>
</html>
